[build-system]
requires = ["requests>=2.28.0",
        "Pillow>=10.0.0,<12.0.0","setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "flightracker"
version = "0.1.1"

[tool.setuptools.packages.find]
where = ["src"]

[project.entry-points.'bullpen.mlbled.plugin']
"flighttracker" = "flighttracker:load"
